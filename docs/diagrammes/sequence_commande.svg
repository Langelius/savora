<svg viewBox="0 0 1170 800" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="msg" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333333"/>
    </marker>
    <marker id="ret" markerWidth="11" markerHeight="11" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#555555" stroke-width="1.2"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1170" height="800" fill="#FFFFFF"/>

  <!-- Titre -->
  <text x="585" y="38" text-anchor="middle" font-size="23" font-weight="bold" fill="#2E5F8A">Parcours d&#8217;une commande &#8212; diagramme de s&#233;quence</text>
  <text x="585" y="59" text-anchor="middle" font-size="13" fill="#666666">Du panier au paiement, puis suivi en temps r&#233;el et notation</text>

  <!-- ===== Lignes de vie (dashed) ===== -->
  <g stroke="#BBBBBB" stroke-width="1.4" stroke-dasharray="5,5">
    <line x1="120" y1="108" x2="120" y2="752"/>
    <line x1="400" y1="108" x2="400" y2="752"/>
    <line x1="650" y1="108" x2="650" y2="752"/>
    <line x1="850" y1="108" x2="850" y2="752"/>
    <line x1="1050" y1="108" x2="1050" y2="752"/>
  </g>

  <!-- Barre d&#8217;activation Backend -->
  <rect x="394" y="196" width="12" height="528" fill="#D6E4F0" stroke="#2E5F8A" stroke-width="1"/>

  <!-- ===== En-t&#234;tes des participants ===== -->
  <!-- Client -->
  <rect x="45" y="72" width="150" height="36" rx="6" fill="#D6E4F0" stroke="#2E5F8A" stroke-width="2"/>
  <text x="120" y="95" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a52">Client (React Native)</text>
  <!-- Backend -->
  <rect x="325" y="72" width="150" height="36" rx="6" fill="#2E5F8A" stroke="#1a3a52" stroke-width="2"/>
  <text x="400" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Backend (API)</text>
  <!-- MongoDB -->
  <rect x="575" y="72" width="150" height="36" rx="6" fill="#E3F1E4" stroke="#3B7A3F" stroke-width="2"/>
  <text x="650" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#2a5c2d">MongoDB</text>
  <!-- Stripe -->
  <rect x="775" y="72" width="150" height="36" rx="6" fill="#EDE7FA" stroke="#6451B0" stroke-width="2"/>
  <text x="850" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#43367a">Stripe (sandbox)</text>
  <!-- Restaurant -->
  <rect x="975" y="72" width="150" height="36" rx="6" fill="#FCEEDC" stroke="#C77B25" stroke-width="2"/>
  <text x="1050" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a5616">Restaurant</text>

  <!-- ============ MESSAGES ============ -->
  <g font-size="12.5" fill="#222222">

    <!-- 1. Self : panier -->
    <path d="M120,150 H175 V168 H126" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#msg)"/>
    <text x="182" y="155" font-size="12.5" fill="#222222">Parcourir le menu, personnaliser, ajouter au panier</text>

    <!-- 2. Client -> Backend -->
    <line x1="120" y1="202" x2="394" y2="202" stroke="#333333" stroke-width="1.6" marker-end="url(#msg)"/>
    <text x="257" y="196" text-anchor="middle">POST /commandes &#8212; passer la commande</text>

    <!-- 3. Backend -> MongoDB -->
    <line x1="406" y1="242" x2="650" y2="242" stroke="#333333" stroke-width="1.6" marker-end="url(#msg)"/>
    <text x="528" y="236" text-anchor="middle">Cr&#233;er la commande (statut : en attente)</text>

    <!-- 4. Backend -> Stripe -->
    <line x1="406" y1="282" x2="850" y2="282" stroke="#333333" stroke-width="1.6" marker-end="url(#msg)"/>
    <text x="628" y="276" text-anchor="middle">Cr&#233;er le paiement (mode test)</text>

    <!-- 5. Stripe --> Backend (retour) -->
    <line x1="850" y1="322" x2="406" y2="322" stroke="#555555" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#ret)"/>
    <text x="628" y="316" text-anchor="middle" fill="#555555">Paiement confirm&#233;</text>

    <!-- 6. Backend -> MongoDB -->
    <line x1="406" y1="362" x2="650" y2="362" stroke="#333333" stroke-width="1.6" marker-end="url(#msg)"/>
    <text x="528" y="356" text-anchor="middle">Statut &#8594; pay&#233;e / en pr&#233;paration</text>

    <!-- 7. Backend --> Client (retour) -->
    <line x1="394" y1="402" x2="120" y2="402" stroke="#555555" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#ret)"/>
    <text x="257" y="396" text-anchor="middle" fill="#555555">Confirmation de la commande</text>

    <!-- 8. Backend -> Restaurant -->
    <line x1="406" y1="442" x2="1050" y2="442" stroke="#333333" stroke-width="1.6" marker-end="url(#msg)"/>
    <text x="728" y="436" text-anchor="middle">Notifier : nouvelle commande (Socket.IO)</text>

  </g>

  <!-- ===== Fragment LOOP (suivi temps r&#233;el) ===== -->
  <rect x="85" y="466" width="1010" height="140" rx="4" fill="none" stroke="#2E5F8A" stroke-width="1.4"/>
  <path d="M85,466 h70 v18 l-12,12 H85 Z" fill="#2E5F8A"/>
  <text x="108" y="483" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">loop</text>
  <text x="170" y="483" font-size="12" font-style="italic" fill="#2E5F8A">[&#224; chaque changement de statut : pr&#233;paration &#8594; en route &#8594; livr&#233;e]</text>

  <g font-size="12.5" fill="#222222">
    <!-- 9. Restaurant -> Backend -->
    <line x1="1050" y1="512" x2="406" y2="512" stroke="#333333" stroke-width="1.6" marker-end="url(#msg)"/>
    <text x="728" y="506" text-anchor="middle">Mettre &#224; jour le statut de la commande</text>

    <!-- 10. Backend -> MongoDB -->
    <line x1="406" y1="552" x2="650" y2="552" stroke="#333333" stroke-width="1.6" marker-end="url(#msg)"/>
    <text x="528" y="546" text-anchor="middle">Enregistrer le nouveau statut</text>

    <!-- 11. Backend --> Client (retour temps r&#233;el) -->
    <line x1="394" y1="592" x2="120" y2="592" stroke="#555555" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#ret)"/>
    <text x="257" y="586" text-anchor="middle" fill="#555555">Mise &#224; jour en temps r&#233;el (Socket.IO)</text>
  </g>

  <!-- ===== Notation (apr&#232;s livraison) ===== -->
  <g font-size="12.5" fill="#222222">
    <!-- 12. Client -> Backend -->
    <line x1="120" y1="648" x2="394" y2="648" stroke="#333333" stroke-width="1.6" marker-end="url(#msg)"/>
    <text x="257" y="642" text-anchor="middle">POST /avis &#8212; note (1&#8211;5) + commentaire</text>

    <!-- 13. Backend -> MongoDB -->
    <line x1="406" y1="688" x2="650" y2="688" stroke="#333333" stroke-width="1.6" marker-end="url(#msg)"/>
    <text x="528" y="682" text-anchor="middle">Enregistrer l&#8217;avis, recalculer la moyenne</text>

    <!-- 14. Backend --> Client -->
    <line x1="394" y1="724" x2="120" y2="724" stroke="#555555" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#ret)"/>
    <text x="257" y="718" text-anchor="middle" fill="#555555">Confirmation</text>
  </g>

  <!-- Note bas de page -->
  <text x="585" y="780" text-anchor="middle" font-size="11" fill="#999999">Trait plein : appel &#183; trait pointill&#233; : r&#233;ponse &#183; le bloc &#171; loop &#187; se r&#233;p&#232;te &#224; chaque changement de statut</text>
</svg>
