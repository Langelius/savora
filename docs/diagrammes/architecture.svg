<svg viewBox="0 0 920 740" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2E5F8A"/>
    </marker>
    <marker id="arrowStart" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M8,0 L0,3 L8,6 Z" fill="#2E5F8A"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="740" fill="#FFFFFF"/>

  <!-- Titre -->
  <text x="460" y="42" text-anchor="middle" font-size="24" font-weight="bold" fill="#2E5F8A">Architecture du système</text>
  <text x="460" y="64" text-anchor="middle" font-size="14" fill="#666666">Application de livraison de repas — React Native · Node.js · MongoDB</text>

  <!-- ===== Couche CLIENT ===== -->
  <text x="40" y="118" font-size="12" font-weight="bold" fill="#999999" letter-spacing="1">CLIENT</text>
  <rect x="290" y="95" width="340" height="92" rx="10" fill="#D6E4F0" stroke="#2E5F8A" stroke-width="2"/>
  <text x="460" y="128" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a3a52">Application mobile</text>
  <text x="460" y="148" text-anchor="middle" font-size="13" fill="#333333">React Native (JS) — base de code unique</text>
  <rect x="350" y="158" width="80" height="22" rx="11" fill="#FFFFFF" stroke="#2E5F8A" stroke-width="1"/>
  <text x="390" y="173" text-anchor="middle" font-size="12" fill="#2E5F8A">Android</text>
  <rect x="490" y="158" width="80" height="22" rx="11" fill="#FFFFFF" stroke="#2E5F8A" stroke-width="1"/>
  <text x="530" y="173" text-anchor="middle" font-size="12" fill="#2E5F8A">iOS</text>

  <!-- Connexions client <-> backend -->
  <line x1="400" y1="187" x2="400" y2="320" stroke="#2E5F8A" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrowStart)"/>
  <line x1="520" y1="187" x2="520" y2="320" stroke="#2E5F8A" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrowStart)"/>
  <rect x="120" y="232" width="160" height="24" rx="4" fill="#F4F8FB" stroke="#B9D2E6" stroke-width="1"/>
  <text x="200" y="248" text-anchor="middle" font-size="12" fill="#2E5F8A">API REST / HTTPS</text>
  <rect x="560" y="232" width="220" height="24" rx="4" fill="#F4F8FB" stroke="#B9D2E6" stroke-width="1"/>
  <text x="670" y="248" text-anchor="middle" font-size="12" fill="#2E5F8A">Socket.IO — WebSocket (temps réel)</text>

  <!-- ===== Couche BACKEND ===== -->
  <text x="40" y="345" font-size="12" font-weight="bold" fill="#999999" letter-spacing="1">SERVEUR</text>
  <rect x="290" y="320" width="340" height="92" rx="10" fill="#2E5F8A" stroke="#1a3a52" stroke-width="2"/>
  <text x="460" y="352" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">Backend — Node.js + Express</text>
  <text x="460" y="372" text-anchor="middle" font-size="13" fill="#D6E4F0">API REST · logique métier · routes</text>
  <rect x="355" y="382" width="210" height="22" rx="11" fill="#FFFFFF"/>
  <text x="460" y="397" text-anchor="middle" font-size="12" font-weight="bold" fill="#2E5F8A">Authentification : JWT + bcrypt</text>

  <!-- Connexions backend -> data/services -->
  <!-- vers MongoDB -->
  <line x1="370" y1="412" x2="180" y2="560" stroke="#2E5F8A" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- vers Stripe -->
  <line x1="460" y1="412" x2="460" y2="560" stroke="#2E5F8A" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- vers Google Maps -->
  <line x1="550" y1="412" x2="740" y2="560" stroke="#2E5F8A" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Couche DONNÉES & SERVICES ===== -->
  <text x="40" y="543" font-size="12" font-weight="bold" fill="#999999" letter-spacing="1">DONNÉES</text>

  <!-- MongoDB (cylindre) -->
  <g>
    <path d="M90,575 a90,16 0 0,0 180,0 v76 a90,16 0 0,1 -180,0 Z" fill="#E3F1E4" stroke="#3B7A3F" stroke-width="2"/>
    <ellipse cx="180" cy="575" rx="90" ry="16" fill="#EAF7EB" stroke="#3B7A3F" stroke-width="2"/>
    <text x="180" y="612" text-anchor="middle" font-size="16" font-weight="bold" fill="#2a5c2d">MongoDB</text>
    <text x="180" y="632" text-anchor="middle" font-size="11" fill="#3B7A3F">Base NoSQL (collections)</text>
  </g>

  <!-- Stripe -->
  <rect x="360" y="563" width="200" height="92" rx="10" fill="#EDE7FA" stroke="#6451B0" stroke-width="2"/>
  <text x="460" y="598" text-anchor="middle" font-size="16" font-weight="bold" fill="#43367a">Stripe API</text>
  <text x="460" y="618" text-anchor="middle" font-size="12" fill="#6451B0">Paiement sécurisé</text>
  <rect x="395" y="628" width="130" height="20" rx="10" fill="#FFFFFF" stroke="#6451B0" stroke-width="1"/>
  <text x="460" y="642" text-anchor="middle" font-size="11" fill="#6451B0">mode test (sandbox)</text>

  <!-- Google Maps -->
  <rect x="650" y="563" width="200" height="92" rx="10" fill="#FCEEDC" stroke="#C77B25" stroke-width="2"/>
  <text x="750" y="598" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a5616">Google Maps API</text>
  <text x="750" y="618" text-anchor="middle" font-size="12" fill="#C77B25">Cartes · distances</text>
  <rect x="685" y="628" width="130" height="20" rx="10" fill="#FFFFFF" stroke="#C77B25" stroke-width="1"/>
  <text x="750" y="642" text-anchor="middle" font-size="11" fill="#C77B25">selon temps disponible</text>

  <!-- Note de bas -->
  <text x="460" y="710" text-anchor="middle" font-size="11" fill="#999999">Architecture client-serveur — hébergement backend : Render / Railway</text>
</svg>
